title: Rosipedia
email: ross@rosipedia.com

description: >- # this means to ignore newlines until "baseurl:"
  Bite-sized takes on AI, coding problems, quick starts, tips and tech news.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://rosipedia.com" # the base hostname & protocol for your site, e.g. https://example.com
timezone: Etc/UTC
twitter_username: Rosipedia
# jekyll-seo-tag reads this nested hash for the twitter:site meta tag (same handle as
# twitter_username above, which minima's footer social link uses).
twitter:
  username: Rosipedia
# Search Console ownership check; jekyll-seo-tag prints it as a meta tag on every page.
webmaster_verifications:
  google: hpYViAb1tvW9NeImktdpED81Rxt0Fi-N8yjJkfq7Z_A

# Build settings
theme: minima
show_excerpts: true
nav_page_ids:
  - series
  - about
plugins:
  - jekyll-feed
  - jekyll-polyglot

languages: ["en", "es"]
default_lang: "en"
exclude_from_localization:
  - "assets"
  - "graphify-out"
  - "CNAME"
  - "sitemap.xml"   # one bilingual sitemap at the root
  - "robots.txt"
  - "favicon.svg"   # icons live once, at the root
  - "favicon.ico"
  - "apple-touch-icon.png"
  - "social-card.png"   # default share image lives once, at the root
parallel_localization: true

# Default social share image (1200x630); a post or page can override with its own `image:`.
defaults:
  - scope:
      path: ""
    values:
      image: /social-card.png

sass:
  sourcemap: never   # documented polyglot/Jekyll-4 caveat

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
exclude:
  - graphify-out/
  - test/
  - Gemfile
  - Gemfile.lock
