title: Alex Ross Study Blog
email: ross@ross-lopez.rocks

description: >- # this means to ignore newlines until "baseurl:"
  Writing about my experiences in Coding, Programming Interview questions and the explanations on the answers I came up with.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://blog.ross-lopez.rocks" # the base hostname & protocol for your site, e.g. https://example.com
timezone: Etc/UTC
twitter_username: _lexRoss
github_username:  alex-ross83

# Build settings
theme: minima
show_excerpts: true
nav_page_ids:
  - about
plugins:
  - jekyll-feed
  - jekyll-polyglot

languages: ["en", "es"]
default_lang: "en"
exclude_from_localization:
  - "assets"
  - "graphify-out"
  - "CNAME"
parallel_localization: true

sass:
  sourcemap: never   # documented polyglot/Jekyll-4 caveat

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
exclude:
  - graphify-out/
  - test/
  - Gemfile
  - Gemfile.lock
