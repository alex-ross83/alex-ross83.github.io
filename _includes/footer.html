<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrap">
    <p class="footer-line p-name">
      <span class="footer-name">
        {%- if site.author -%}{{ site.author | escape }}{%- else -%}{{ site.title | escape }}{%- endif -%}
      </span>
      {%- if site.email -%} · <a class="u-email" href="mailto:{{ site.email }}">{{ site.email }}</a>{%- endif -%}
    </p>
    <p class="footer-desc">{{ site.description | escape }}</p>
    {%- include social.html -%}
  </div>
</footer>
